<!DOCTYPE html>
<html>
    <head>
        <title>
            siwc
        </title>
        <style>
            *{
                margin:0px;
                padding: 0px;
            }
            body{
                width: 100%;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center ;
                background-image: url(open.jpg);
                background-repeat: no-repeat;
                background-size: cover;
                background-attachment: fixed;
                background-position: center;
            }
            .mail{
                position: relative;
                bottom: -300px;
            }
            form{
                align-items: center;
                justify-content: center;
                display: flex ;
                gap: 15px;
                background:transparent;
                
            }
            .login{
                padding: 12px 45px;
                border: none;
                border-radius: 20px;
                font-size: 15px;
                font-weight: 600;
                cursor:pointer;
                background-color: bisque;
                box-shadow: 0 0 30px black;
                transition: all 0.2s ease;
            }
            .login:hover{
                box-shadow: 0 0 20px beige;
            }
            .login:active{
                transform: scale(0.9);
            }
            .signup{
                padding: 12px 45px;
                border: none;
                border-radius: 20px;
                font-weight: 600;
                font-size: 15px;
                cursor:pointer;
                box-shadow: 0 0 30px black;
                transition: all 0.2s ease;
                background-color:bisque;
            }
            .signup:hover{
                box-shadow: 0 0 20px beige;
            }
            .signup:active{
                transform: scale(0.9);
            }
        </style>
    </head>
    <body>
        <div class="mail">
            <form>
                <button type="button" onclick="goToLogin()" class="login">login</button>
                <button type="button" onclick="goToSignup()" class="signup" >sign up</button>
            </form>
        </div>
            <script>
                function goToLogin() {
                    window.location.href = "login.html"; 
                }
                function goToSignup() {
                    window.location.href = "signup.html"; 
                }
            </script>
    </body>
</html>
